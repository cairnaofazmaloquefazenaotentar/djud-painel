name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Módulos puros da Pesquisa de Preços (período, IPCA, duplicidade) e o
      # mapeamento das APIs de dados abertos contra o contrato gravado.
      - name: Autotestes
        run: |
          npx tsx scripts/autoteste-pesquisa-preco.ts
          npx tsx scripts/conferir-mapear-dados-abertos.ts

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    env:
      # Stubs para que o build não falhe sem credenciais reais
      DATABASE_URL: "postgresql://user:pass@localhost:5432/djud?schema=public"
      AUTH_SECRET: "ci-secret-placeholder-32-chars-min"
      AUTH_GOOGLE_ID: "ci-google-id"
      AUTH_GOOGLE_SECRET: "ci-google-secret"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build
        run: npm run build
